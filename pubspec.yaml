name: minto
description: "قُرب · Qurb — anonymous location-based Arabic social network"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  google_fonts: ^6.2.1

  supabase_flutter: ^2.8.0

  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  intl: ^0.20.2
  equatable: ^2.0.7

  geolocator: ^13.0.2

  # Image attachment pipeline (Phase 10).
  # image_picker: official, handles camera + gallery on iOS/Android.
  # pro_image_editor: native Flutter widget for Snapchat-style
  #   annotation (pen, text, crop, stickers). Single-maintainer
  #   but actively released monthly as of late 2025.
  # flutter_image_compress: forces re-encode so all EXIF (incl. GPS)
  #   is stripped before upload.
  # cached_network_image: in-memory + on-disk LRU cache for the
  #   signed-URL post images we render in the feed.
  image_picker: ^1.1.2
  # Pinned to <11.4 — Flutter 3.35 required from 11.4 onward, we're
  # on 3.32. Upgrade the constraint when the Flutter SDK gets bumped.
  pro_image_editor: ">=11.3.0 <11.4.0"
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

# App icon generation. Run after editing:
#   dart run flutter_launcher_icons
# Produces all iOS sizes in ios/Runner/Assets.xcassets/AppIcon.appiconset
# and Android mipmaps (legacy + adaptive). `remove_alpha_ios: true` is
# required because Apple rejects icons with an alpha channel.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/qurb_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  min_sdk_android: 23
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/qurb_logo_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/qurb_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffd84d"
