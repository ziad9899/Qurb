name: minto
description: "قُرب · Qurb — anonymous location-based Arabic social network"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  google_fonts: ^6.2.1

  supabase_flutter: ^2.8.0

  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  intl: ^0.20.2
  equatable: ^2.0.7

  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

# App icon generation. Run after editing:
#   dart run flutter_launcher_icons
# Produces all iOS sizes in ios/Runner/Assets.xcassets/AppIcon.appiconset
# and Android mipmaps (legacy + adaptive). `remove_alpha_ios: true` is
# required because Apple rejects icons with an alpha channel.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/qurb_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  min_sdk_android: 23
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/qurb_logo_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/qurb_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffd84d"
